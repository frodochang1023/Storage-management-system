<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倉庫庫存管理系統 (單機離線永久版)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        
        #login-page {
            display: flex; justify-content: center; align-items: center; height: 100vh;
            background: #2c3e50;
        }
        .login-card {
            background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 360px;
        }
        .login-card h2 { text-align: center; margin-bottom: 20px; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;
        }
        .btn {
            width: 100%; padding: 10px; background: #3498db; color: white; border: none;
            border-radius: 4px; cursor: pointer; font-size: 16px;
        }
        .btn:hover { background: #2980b9; }

        #main-system { display: none; }
        header {
            background: #2c3e50; color: white; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        nav { display: flex; background: #34495e; flex-wrap: wrap; }
        nav button {
            background: none; border: none; color: white; padding: 15px 20px;
            cursor: pointer; font-size: 15px; flex: 1; min-width: 120px;
        }
        nav button.active { background: #3498db; font-weight: bold; }

        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card h3 { margin-bottom: 15px; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 8px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; color: #2c3e50; }
        tr:nth-child(even) { background-color: #f9f9f9; }

        .search-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-bar input { flex: 1; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-success { background: #2ecc71; }
        .btn-success:hover { background: #27ae60; }
        .btn-export { background: #e67e22; width: auto; padding: 8px 15px; font-size: 14px; }
        .btn-export:hover { background: #d35400; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

        @media (max-width: 768px) {
            nav { flex-direction: column; }
            th, td { padding: 8px; font-size: 14px; }
            .search-bar { flex-direction: column; }
            .toolbar { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- 1. 登入層 -->
    <div id="login-page">
        <div class="login-card">
            <h2>庫存系統登入</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>使用者名稱</label>
                    <select id="username" required>
                        <option value="">-- 請選擇操作人員 --</option>
                        <option value="子揚">子揚</option>
                        <option value="宇呈">宇呈</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>密碼</label>
                    <input type="password" id="password" placeholder="請輸入密碼" required>
                </div>
                <button type="submit" class="btn">登入系統</button>
            </form>
        </div>
    </div>

    <!-- 2. 主系統層 -->
    <div id="main-system">
        <header>
            <h2>倉庫庫存管理系統</h2>
            <div>修改人員：<span id="current-user">管理者</span> | <a href="#" id="logout-btn" style="color:#e74c3c;">登出</a></div>
        </header>

        <!-- 分頁圖示化介面 -->
        <nav>
            <button class="nav-btn active" onclick="switchTab('tab-inventory')">📦 庫存總覽與搜尋</button>
            <button class="nav-btn" onclick="switchTab('tab-manage')">➕ 新增 / 刪除商品</button>
            <button class="nav-btn" onclick="switchTab('tab-transfer')">🔄 跨倉移動 / 調撥</button>
            <button class="nav-btn" onclick="switchTab('tab-logs')">📜 異動紀錄 (Audit Log)</button>
            <button class="nav-btn" onclick="switchTab('tab-backup')">💾 資料匯出與備份</button>
        </nav>

        <div class="container">
            <!-- 分頁 1: 庫存總覽與搜尋 -->
            <div id="tab-inventory" class="tab-content active">
                <div class="card">
                    <div class="toolbar">
                        <h3>商品庫存即時狀態</h3>
                        <button class="btn btn-export" onclick="exportInventoryCSV()">📥 匯出庫存 Excel (CSV)</button>
                    </div>
                    <div class="search-bar">
                        <input type="text" id="search-input" class="form-group input" placeholder="搜尋品牌、商品名稱或型號..." onkeyup="filterInventory()">
                    </div>
                    <table id="inventory-table">
                        <thead>
                            <tr>
                                <th>商品編號</th>
                                <th>品牌</th>
                                <th>商品名稱</th>
                                <th>類型</th>
                                <th>倉庫 A 數量</th>
                                <th>倉庫 B 數量</th>
                                <th>倉庫 C 數量</th>
                                <th>總數量</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- 分頁 2: 新增/刪除商品 -->
            <div id="tab-manage" class="tab-content">
                <div class="card">
                    <h3>新增商品至資料庫</h3>
                    <form id="add-product-form">
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                            <div class="form-group">
                                <label>商品編號/型號</label>
                                <input type="text" id="p-id" required>
                            </div>
                            <div class="form-group">
                                <label>品牌</label>
                                <input type="text" id="p-brand" required>
                            </div>
                            <div class="form-group">
                                <label>商品名稱</label>
                                <input type="text" id="p-name" required>
                            </div>
                            <div class="form-group">
                                <label>類型</label>
                                <input type="text" id="p-category" required>
                            </div>
                            <div class="form-group">
                                <label>初始庫存倉庫</label>
                                <select id="p-warehouse">
                                    <option value="A">倉庫 A</option>
                                    <option value="B">倉庫 B</option>
                                    <option value="C">倉庫 C</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>初始數量</label>
                                <input type="number" id="p-qty" min="1" value="1" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success" style="margin-top: 10px;">確認新增商品</button>
                    </form>
                </div>

                <div class="card">
                    <h3>刪除商品</h3>
                    <div style="display: flex; gap: 10px;">
                        <select id="delete-p-select" class="form-group input" style="flex:1;"></select>
                        <button class="btn btn-danger" style="width:120px;" onclick="deleteProduct()">刪除商品</button>
                    </div>
                </div>
            </div>

            <!-- 分頁 3: 跨倉移動 -->
            <div id="tab-transfer" class="tab-content">
                <div class="card">
                    <h3>庫存調撥與位置變更</h3>
                    <form id="transfer-form">
                        <div class="form-group">
                            <label>選擇商品</label>
                            <select id="t-product" class="form-group input" required></select>
                        </div>
                        <div style="display: flex; gap: 15px;">
                            <div class="form-group" style="flex: 1;">
                                <label>來源倉庫</label>
                                <select id="t-from" class="form-group input">
                                    <option value="A">倉庫 A</option>
                                    <option value="B">倉庫 B</option>
                                    <option value="C">倉庫 C</option>
                                </select>
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label>目的倉庫</label>
                                <select id="t-to" class="form-group input">
                                    <option value="B">倉庫 B</option>
                                    <option value="A">倉庫 A</option>
                                    <option value="C">倉庫 C</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>調撥數量</label>
                            <input type="number" id="t-qty" min="1" value="1" class="form-group input" required>
                        </div>
                        <button type="submit" class="btn">執行調撥</button>
                    </form>
                </div>
            </div>

            <!-- 分頁 4: 異動紀錄 -->
            <div id="tab-logs" class="tab-content">
                <div class="card">
                    <div class="toolbar">
                        <h3>系統操作與異動歷史紀錄</h3>
                        <button class="btn btn-export" onclick="exportLogsCSV()">📥 匯出歷史紀錄 CSV</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>時間</th>
                                <th>修改者 (操作人員)</th>
                                <th>動作類別</th>
                                <th>商品名稱 (編號)</th>
                                <th>異動細節</th>
                            </tr>
                        </thead>
                        <tbody id="logs-table-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- 分頁 5: 備份與備份匯入 -->
            <div id="tab-backup" class="tab-content">
                <div class="card">
                    <h3>資料備份與轉移 (JSON 格式)</h3>
                    <p style="margin-bottom: 15px; color: #666;">您可以下載備份檔，並匯入至其他電腦或手機瀏覽器中。</p>
                    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                        <button class="btn btn-export" onclick="exportJSONBackup()">💾 下載完整系統備份檔 (.json)</button>
                    </div>
                    <hr style="margin: 20px 0;">
                    <h3>匯入備份資料</h3>
                    <input type="file" id="import-file" accept=".json" class="form-group input" style="margin-top: 10px;">
                    <button class="btn btn-success" style="margin-top: 10px;" onclick="importJSONBackup()">📤 匯入備份資料</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = "";
        
        // 從 本地 LocalStorage 讀取資料，若無則初始化預設資料
        let products = JSON.parse(localStorage.getItem("INVENTORY_PRODUCTS")) || [
            { id: "P001", brand: "Logitech", name: "無線滑鼠 M330", category: "電腦週邊", qtyA: 10, qtyB: 5, qtyC: 0 },
            { id: "P002", brand: "ASUS", name: "27吋 螢幕", category: "顯示器", qtyA: 2, qtyB: 8, qtyC: 4 }
        ];
        let logs = JSON.parse(localStorage.getItem("INVENTORY_LOGS")) || [];

        // 儲存資料到瀏覽器 (永久存在)
        function saveData() {
            localStorage.setItem("INVENTORY_PRODUCTS", JSON.stringify(products));
            localStorage.setItem("INVENTORY_LOGS", JSON.stringify(logs));
        }

        // 登入驗證處理
        document.getElementById("login-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById("username").value;
            const passwordInput = document.getElementById("password").value;

            // 驗證使用者與密碼
            const allowedUsers = ["子揚", "宇呈"];
            if (!allowedUsers.includes(usernameInput)) {
                alert("無效的使用者名稱！僅限「子揚」與「宇呈」登入。");
                return;
            }

            if (passwordInput !== "1234") {
                alert("密碼錯誤！請輸入正確密碼。");
                return;
            }

            currentUser = usernameInput;
            document.getElementById("current-user").innerText = currentUser;
            document.getElementById("login-page").style.display = "none";
            document.getElementById("main-system").style.display = "block";
            renderAll();
            addLog("系統登入", "-", "操作人員成功進入系統");
        });

        document.getElementById("logout-btn").addEventListener("click", function() { location.reload(); });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function renderAll() {
            renderInventory();
            renderSelects();
            renderLogs();
        }

        function renderInventory() {
            const tbody = document.querySelector("#inventory-table tbody");
            tbody.innerHTML = "";
            products.forEach(p => {
                const total = p.qtyA + p.qtyB + p.qtyC;
                tbody.innerHTML += `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.brand}</td>
                        <td>${p.name}</td>
                        <td>${p.category}</td>
                        <td>${p.qtyA}</td>
                        <td>${p.qtyB}</td>
                        <td>${p.qtyC}</td>
                        <td><strong>${total}</strong></td>
                    </tr>`;
            });
        }

        function renderSelects() {
            const delSelect = document.getElementById("delete-p-select");
            const transSelect = document.getElementById("t-product");
            delSelect.innerHTML = ""; transSelect.innerHTML = "";
            products.forEach(p => {
                const opt = `<option value="${p.id}">${p.brand} - ${p.name} (${p.id})</option>`;
                delSelect.innerHTML += opt;
                transSelect.innerHTML += opt;
            });
        }

        function renderLogs() {
            const tbody = document.getElementById("logs-table-body");
            tbody.innerHTML = "";
            logs.slice().reverse().forEach(l => {
                tbody.innerHTML += `
                    <tr>
                        <td>${l.time}</td>
                        <td><strong>${l.user}</strong></td>
                        <td>${l.action}</td>
                        <td>${l.item}</td>
                        <td>${l.detail}</td>
                    </tr>`;
            });
        }

        function addLog(action, item, detail) {
            const now = new Date().toLocaleString();
            logs.push({ time: now, user: currentUser, action, item, detail });
            saveData();
            renderLogs();
        }

        function filterInventory() {
            const val = document.getElementById("search-input").value.toLowerCase();
            document.querySelectorAll("#inventory-table tbody tr").forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(val) ? "" : "none";
            });
        }

        // 新增商品
        document.getElementById("add-product-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const id = document.getElementById("p-id").value;
            const brand = document.getElementById("p-brand").value;
            const name = document.getElementById("p-name").value;
            const category = document.getElementById("p-category").value;
            const wh = document.getElementById("p-warehouse").value;
            const qty = parseInt(document.getElementById("p-qty").value);

            if(products.find(p => p.id === id)) {
                alert("商品編號已存在！");
                return;
            }

            let newP = { id, brand, name, category, qtyA: 0, qtyB: 0, qtyC: 0 };
            newP[`qty${wh}`] = qty;
            products.push(newP);
            addLog("新增商品", `${name} (${id})`, `在倉庫${wh}初始入庫 ${qty} 件`);
            saveData();
            renderAll();
            this.reset();
            alert("新增成功！");
        });

        // 刪除商品
        function deleteProduct() {
            const id = document.getElementById("delete-p-select").value;
            const p = products.find(item => item.id === id);
            if(p && confirm(`確定刪除 ${p.name}？`)) {
                products = products.filter(item => item.id !== id);
                addLog("刪除商品", `${p.name} (${id})`, "從資料庫移除商品");
                saveData();
                renderAll();
            }
        }

        // 跨倉調撥
        document.getElementById("transfer-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const id = document.getElementById("t-product").value;
            const from = document.getElementById("t-from").value;
            const to = document.getElementById("t-to").value;
            const qty = parseInt(document.getElementById("t-qty").value);

            if(from === to) return alert("來源與目的倉庫不能相同！");

            let p = products.find(item => item.id === id);
            if(p[`qty${from}`] < qty) return alert(`倉庫 ${from} 庫存不足！現有：${p[`qty${from}`]}`);

            p[`qty${from}`] -= qty;
            p[`qty${to}`] += qty;
            addLog("跨倉調撥", `${p.name} (${id})`, `將 ${qty} 件商品從倉庫${from}移動至倉庫${to}`);
            saveData();
            renderAll();
            alert("調撥完成！");
        });

        // --- 匯出功能實現 --- //

        // 1. 匯出 庫存表 CSV (加 BOM 避免 Excel 中文亂碼)
        function exportInventoryCSV() {
            let csv = "\uFEFF商品編號,品牌,商品名稱,類型,倉庫A數量,倉庫B數量,倉庫C數量,總數量\n";
            products.forEach(p => {
                const total = p.qtyA + p.qtyB + p.qtyC;
                csv += `"${p.id}","${p.brand}","${p.name}","${p.category}",${p.qtyA},${p.qtyB},${p.qtyC},${total}\n`;
            });
            downloadFile(csv, "庫存總覽表.csv", "text/csv;charset=utf-8;");
        }

        // 2. 匯出 修改紀錄 CSV
        function exportLogsCSV() {
            let csv = "\uFEFF時間,修改者,動作類別,商品資訊,異動細節\n";
            logs.forEach(l => {
                csv += `"${l.time}","${l.user}","${l.action}","${l.item}","${l.detail}"\n`;
            });
            downloadFile(csv, "系統異動紀錄.csv", "text/csv;charset=utf-8;");
        }

        // 3. 匯出 完整 JSON 備份
        function exportJSONBackup() {
            const data = { products, logs };
            downloadFile(JSON.stringify(data, null, 2), "庫存系統完整備份.json", "application/json");
        }

        // 4. 匯入 JSON 備份
        function importJSONBackup() {
            const fileInput = document.getElementById("import-file");
            if(!fileInput.files.length) return alert("請先選擇備份檔案 (.json)");

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if(data.products && data.logs) {
                        products = data.products;
                        logs = data.logs;
                        saveData();
                        renderAll();
                        alert("資料成功匯入與覆蓋！");
                    } else {
                        alert("備份檔案格式不正確！");
                    }
                } catch(err) {
                    alert("解析備份檔案失敗！");
                }
            };
            reader.readAsText(fileInput.files[0]);
        }

        // 通用檔案下載函式
        function downloadFile(content, fileName, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            a.click();
        }
    </script>
</body>
</html>
